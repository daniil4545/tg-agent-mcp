name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tg_agent_mcp
          POSTGRES_PASSWORD: tg_agent_mcp
          POSTGRES_DB: tg_agent_mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tg_agent_mcp -d tg_agent_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tg_agent_mcp:tg_agent_mcp@localhost:5432/tg_agent_mcp?sslmode=disable
      TEST_DATABASE_URL: postgres://tg_agent_mcp:tg_agent_mcp@localhost:5432/tg_agent_mcp?sslmode=disable
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: a linter built with an older Go refuses to read the module.
          version: v2.15.0
          # make ci-check runs the linter itself; the action only installs it.
          install-only: true
      # Migrations, integration tests against the service container, vet, gofmt,
      # golangci-lint and build.
      - run: make ci-check
      - run: make deploy-check
      - run: shellcheck ../deploy/safe-ssh.sh
