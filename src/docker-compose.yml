# Local Postgres for development. The project name is set explicitly: by
# default Compose takes it from the directory name, and every service has a
# src directory - without this line the volumes of different projects would
# merge into one.
#
# Port 5433, not 5432: another local Postgres usually occupies 5432, and it is
# common to keep both up at once.
name: tg-agent-mcp

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tg_agent_mcp
      POSTGRES_PASSWORD: tg_agent_mcp
      POSTGRES_DB: tg_agent_mcp
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_agent_mcp -d tg_agent_mcp"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
