# Sender for one account: started as its own project next to the main stack
# (`docker-compose.local.yml`), it takes rows from that stack's queue.
#
# Why a separate file: one account needs one process with its own MTProto
# session, and listing app2, app3 in the main compose is not possible - a
# required variable inside a profile breaks interpolation of the whole file even
# when the profile is not started (verified 2026-09-11). This file describes
# exactly one sender, and the list of accounts lives in project names and in
# the files accounts/<label>.env.
#
# Started only by the `account-*` Makefile targets: they set LABEL and TRANSPORT
# and check that the account label does not match the label of the main stack.
#
# There is no control interface here: MCP runs as exactly one instance, the main
# stack. No port is published; the process reaches the database and its
# neighbours over the internal network of the main stack.

services:
  app:
    build: .
    # Per-account values: label, phone, Telegram application keys, and where
    # needed the proxy and the cap. The keys are deliberately not inherited from
    # the main stack: they are obtained on my.telegram.org for the account's
    # phone number.
    # Shared stack settings come below from src/.env: the list of service
    # recipients, the window and the thresholds must match across all processes -
    # they take part in the spend count and in the guards, and if they diverged
    # a guard would be lifted from the wrong person.
    env_file:
      - accounts/${LABEL}.env
    environment:
      ENV: ${ENV:-prod}
      DATABASE_URL: postgres://tg_agent_mcp:${POSTGRES_PASSWORD}@postgres:5432/tg_agent_mcp?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # A dedicated variable name instead of the shared TRANSPORT: that one is
      # set to live in src/.env and would silently enable sending on an account
      # nobody has logged in to yet. The target sets it: account-up starts the
      # sender in dry-run for login, account-live starts it in live mode.
      TRANSPORT: ${SENDER_TRANSPORT:-dry-run}
      SEND_WINDOW_START: ${SEND_WINDOW_START:-10:00}
      SEND_WINDOW_END: ${SEND_WINDOW_END:-19:00}
      SEND_PAUSE_MIN: ${SEND_PAUSE_MIN:-10m}
      SEND_PAUSE_MAX: ${SEND_PAUSE_MAX:-30m}
      FLOOD_WAIT_THRESHOLD: ${FLOOD_WAIT_THRESHOLD:-10m}
      CLAIM_STALE_AFTER: ${CLAIM_STALE_AFTER:-5m}
      DEV_ALLOW_LIST: ${DEV_ALLOW_LIST:-}
      # Evening digest: label of the account that sends it, and its recipients.
      # Empty keeps the old behavior: any sender sends to all service recipients.
      DIGEST_ACCOUNT: ${DIGEST_ACCOUNT:-}
      DIGEST_TO: ${DIGEST_TO:-}
      MCP_ENABLED: "false"
      HEALTH_ADDR: ":8081"
      TELEGRAM_STORAGE_PATH: /var/lib/tg-agent-mcp/telegram.db
    # A per-project volume, not a shared one: each account has its own session
    # file, otherwise logging in to one account would overwrite the session of
    # its neighbour.
    volumes:
      - telegram_data:/var/lib/tg-agent-mcp
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Network of the main stack: the sender reaches the campaign database over it
# by the service name postgres. The sender has no database of its own and must
# not have one - the queue, the caps and the touch log are shared by all
# accounts.
networks:
  default:
    name: tg-agent-mcp-live_default
    external: true

volumes:
  telegram_data:
