# Канонический стек Coolify. Файл репозитория - источник истины: в Coolify он
# кладётся в docker_compose_raw, а APP_IMAGE обновляется перед каждым выкатом.
#
# Секреты только через окружение Coolify: ни токена MCP, ни доступов Telegram в
# репозитории нет и быть не должно.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tg_agent_mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: tg_agent_mcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_agent_mcp -d tg_agent_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "tg-agent-mcp-{{.Name}}"

  # Миграции - отдельным разовым контейнером того же образа: сервис поднимается
  # уже на готовой схеме и не мигрирует базу из-под себя при каждом рестарте.
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    exclude_from_hc: true
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?DATABASE_URL must be set}
    command: ["/goose", "-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: journald
      options:
        tag: "tg-agent-mcp-{{.Name}}"

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Аккаунт процесса: второй аккаунт - второй контейнер с другой меткой и
      # MCP_ENABLED=false поверх той же базы.
      ACCOUNT_LABEL: ${ACCOUNT_LABEL:?ACCOUNT_LABEL must be set}
      ACCOUNT_DAILY_LIMIT: ${ACCOUNT_DAILY_LIMIT:-30}
      # dry-run по умолчанию: живая отправка включается только вместе с ENV=prod.
      TRANSPORT: ${TRANSPORT:-dry-run}
      SEND_WINDOW_START: ${SEND_WINDOW_START:-10:00}
      SEND_WINDOW_END: ${SEND_WINDOW_END:-19:00}
      SEND_PAUSE_MIN: ${SEND_PAUSE_MIN:-10m}
      SEND_PAUSE_MAX: ${SEND_PAUSE_MAX:-30m}
      FLOOD_WAIT_THRESHOLD: ${FLOOD_WAIT_THRESHOLD:-10m}
      CLAIM_STALE_AFTER: ${CLAIM_STALE_AFTER:-5m}
      # Последний рубеж вне prod: пусто - ограничения нет, список - писать
      # можно только перечисленным.
      DEV_ALLOW_LIST: ${DEV_ALLOW_LIST:-}
      # Вечерняя сводка: метка аккаунта, который её отправляет, и её получатели.
      # Пусто - прежнее поведение: шлёт любой отправщик всем служебным адресатам.
      DIGEST_ACCOUNT: ${DIGEST_ACCOUNT:-}
      DIGEST_TO: ${DIGEST_TO:-}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_ADDR: ${MCP_ADDR:-:8080}
      MCP_TOKEN: ${MCP_TOKEN:?MCP_TOKEN must be set}
      MCP_AGENT_TOKEN: ${MCP_AGENT_TOKEN:-}
      AGENT_ALLOW_LIST: ${AGENT_ALLOW_LIST:-}
      HEALTH_ADDR: ${HEALTH_ADDR:-:8081}
      # Доступы к живому аккаунту нужны только при TRANSPORT=live; в dry-run
      # контуре переменные пустые и не читаются вовсе.
      TELEGRAM_APP_ID: ${TELEGRAM_APP_ID:-}
      TELEGRAM_APP_HASH: ${TELEGRAM_APP_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_STORAGE_PATH: /var/lib/tg-agent-mcp/telegram.db
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    volumes:
      - telegram_data:/var/lib/tg-agent-mcp
    # Порт MCP публикуется прокси Coolify по домену сервиса; наружу из compose
    # он не пробрасывается - доступ ограничен адресом и bearer-токеном.
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Стоп аккаунта красит контейнер: другого канала тревоги в MVP нет.
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "tg-agent-mcp-{{.Name}}"

volumes:
  postgres_data:
  telegram_data:
