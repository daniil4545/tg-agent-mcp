# Canonical Coolify stack. The repository file is the source of truth: it is
# placed into docker_compose_raw in Coolify, and APP_IMAGE is updated before
# every rollout.
#
# Secrets only through the Coolify environment: neither the MCP token nor the
# Telegram credentials are in the repository, and they must never be.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tg_agent_mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: tg_agent_mcp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_agent_mcp -d tg_agent_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "tg-agent-mcp-{{.Name}}"

  # Migrations run in a separate one-shot container of the same image: the
  # service starts on a ready schema and does not migrate the database from
  # under itself on every restart.
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    exclude_from_hc: true
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?DATABASE_URL must be set}
    command: ["/goose", "-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: journald
      options:
        tag: "tg-agent-mcp-{{.Name}}"

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Account of this process: a second account is a second container with
      # another label and MCP_ENABLED=false on top of the same database.
      ACCOUNT_LABEL: ${ACCOUNT_LABEL:?ACCOUNT_LABEL must be set}
      ACCOUNT_DAILY_LIMIT: ${ACCOUNT_DAILY_LIMIT:-30}
      # dry-run by default: live sending is enabled only together with ENV=prod.
      TRANSPORT: ${TRANSPORT:-dry-run}
      SEND_WINDOW_START: ${SEND_WINDOW_START:-10:00}
      SEND_WINDOW_END: ${SEND_WINDOW_END:-19:00}
      SEND_PAUSE_MIN: ${SEND_PAUSE_MIN:-10m}
      SEND_PAUSE_MAX: ${SEND_PAUSE_MAX:-30m}
      FLOOD_WAIT_THRESHOLD: ${FLOOD_WAIT_THRESHOLD:-10m}
      CLAIM_STALE_AFTER: ${CLAIM_STALE_AFTER:-5m}
      # Last guard outside prod: empty means no restriction, a list means
      # only the listed people may be messaged.
      DEV_ALLOW_LIST: ${DEV_ALLOW_LIST:-}
      # Evening digest: label of the account that sends it, and its recipients.
      # Empty keeps the old behavior: any sender sends to all service recipients.
      DIGEST_ACCOUNT: ${DIGEST_ACCOUNT:-}
      DIGEST_TO: ${DIGEST_TO:-}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_ADDR: ${MCP_ADDR:-:8080}
      MCP_TOKEN: ${MCP_TOKEN:?MCP_TOKEN must be set}
      MCP_AGENT_TOKEN: ${MCP_AGENT_TOKEN:-}
      AGENT_ALLOW_LIST: ${AGENT_ALLOW_LIST:-}
      HEALTH_ADDR: ${HEALTH_ADDR:-:8081}
      # Live account credentials are needed only with TRANSPORT=live; in the
      # dry-run stack the variables are empty and not read at all.
      TELEGRAM_APP_ID: ${TELEGRAM_APP_ID:-}
      TELEGRAM_APP_HASH: ${TELEGRAM_APP_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_STORAGE_PATH: /var/lib/tg-agent-mcp/telegram.db
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    volumes:
      - telegram_data:/var/lib/tg-agent-mcp
    # The MCP port is published by the Coolify proxy on the service domain; it
    # is not forwarded outside from compose - access is limited by the address
    # and a bearer token.
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # An account stop turns the container unhealthy: the MVP has no other alert
    # channel.
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "tg-agent-mcp-{{.Name}}"

volumes:
  postgres_data:
  telegram_data:
