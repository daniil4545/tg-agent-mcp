version: "2"

# Набор по умолчанию плюс два исключения. Оба сознательные, а не обход красного:
# QF-проверки staticcheck переписывают читаемый код в более короткий, но не более
# понятный; непроверенный возврат в тестовых заглушках шумит и ничего не ловит.
linters:
  settings:
    staticcheck:
      checks:
        - all
        # Набор ST по умолчанию выключен самим golangci-lint: это правила
        # оформления комментариев и имён, они спорят с русскими комментариями.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -QF1001 # закон де Моргана: явное отрицание пары читается лучше
        - -QF1002 # switch с тегом: набор случаев здесь не по одному значению
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
