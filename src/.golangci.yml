version: "2"

# The default set plus two exclusions. Both are deliberate, not a way around a
# red build: staticcheck QF checks rewrite readable code into shorter but not
# clearer code; an unchecked return in test stubs is noisy and catches nothing.
linters:
  settings:
    staticcheck:
      checks:
        - all
        # golangci-lint itself disables the ST set by default: these are rules
        # for comment and name style, and this project does not enforce them.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -QF1001 # De Morgan's law: an explicit negation of a pair reads better
        - -QF1002 # tagged switch: the cases here are not on a single value
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
