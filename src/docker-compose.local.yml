# Live stack on the operator's machine: the MCP server and the sender next to
# Claude Code.
#
# The service runs locally, not on a VPS. Three reasons: Claude Code connects to 127.0.0.1, so no domain or tunnel is
# needed; sending goes from a home IP rather than a datacenter one, which is
# more natural for a live Telegram account; nothing is exposed outside.
#
# Cost: sending runs only while the machine is on. The daily batch is small and
# the window is 10:00-19:00 on weekdays, so an ordinary working day is enough;
# a day of sleep means a day without sending, not a lost queue.
#
# The project and volumes are separate from docker-compose.yml: that one starts
# the test database, and `make test` rebuilds it. The campaign queue must not
# live there - it holds the record of who was already messaged.
name: tg-agent-mcp-live

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tg_agent_mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: tg_agent_mcp
    # The port is not published: only the application in this network reaches the
    # database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_agent_mcp -d tg_agent_mcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build: .
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://tg_agent_mcp:${POSTGRES_PASSWORD}@postgres:5432/tg_agent_mcp?sslmode=disable
    command: ["/goose", "-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    environment:
      # prod, because live sending is possible only there; the stack is live
      # even though it runs on a laptop.
      ENV: ${ENV:-prod}
      DATABASE_URL: postgres://tg_agent_mcp:${POSTGRES_PASSWORD}@postgres:5432/tg_agent_mcp?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ACCOUNT_LABEL: ${ACCOUNT_LABEL:?ACCOUNT_LABEL must be set}
      ACCOUNT_DAILY_LIMIT: ${ACCOUNT_DAILY_LIMIT:-20}
      # dry-run by default: live is switched on by hand after logging in to the
      # account and a trial send to the operator's own accounts.
      TRANSPORT: ${TRANSPORT:-dry-run}
      SEND_WINDOW_START: ${SEND_WINDOW_START:-10:00}
      SEND_WINDOW_END: ${SEND_WINDOW_END:-19:00}
      # The pause is the whole sender iteration: it is when the sender notices
      # both a campaign start and the window opening. 10-30 minutes is the default
      # pace.
      SEND_PAUSE_MIN: ${SEND_PAUSE_MIN:-10m}
      SEND_PAUSE_MAX: ${SEND_PAUSE_MAX:-30m}
      FLOOD_WAIT_THRESHOLD: ${FLOOD_WAIT_THRESHOLD:-10m}
      CLAIM_STALE_AFTER: ${CLAIM_STALE_AFTER:-5m}
      # Last guard: empty means no restriction, a list means only the listed
      # people may be messaged. During a trial this holds the operator's own
      # usernames.
      DEV_ALLOW_LIST: ${DEV_ALLOW_LIST:-}
      # Evening digest: label of the account that sends it, and its recipients.
      # Empty keeps the old behavior: any sender sends to all service recipients.
      DIGEST_ACCOUNT: ${DIGEST_ACCOUNT:-}
      DIGEST_TO: ${DIGEST_TO:-}
      MCP_ENABLED: "true"
      MCP_ADDR: ":8080"
      MCP_TOKEN: ${MCP_TOKEN:?MCP_TOKEN must be set}
      MCP_AGENT_TOKEN: ${MCP_AGENT_TOKEN:-}
      AGENT_ALLOW_LIST: ${AGENT_ALLOW_LIST:-}
      HEALTH_ADDR: ":8081"
      TELEGRAM_APP_ID: ${TELEGRAM_APP_ID:-}
      TELEGRAM_APP_HASH: ${TELEGRAM_APP_HASH:-}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
      TELEGRAM_STORAGE_PATH: /var/lib/tg-agent-mcp/telegram.db
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    volumes:
      - telegram_data:/var/lib/tg-agent-mcp
    # Loopback only: the endpoint must not be visible even on the home network.
    ports:
      - "127.0.0.1:${MCP_PORT:-8087}:8080"
      - "127.0.0.1:${HEALTH_PORT:-8088}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  telegram_data:
